[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "brennstuhl-webline-client"
version = "0.1.0"
description = "Python client library and CLI for Brennstuhl Premium-Web-Line V3"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
psu = "brennstuhl_webline_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brennstuhl_webline_client*"]
